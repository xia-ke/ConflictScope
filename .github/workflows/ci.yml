name: ConflictScope regression
on:
  push:
    branches:
      - feature/v3-p0-geoeconomic-foundation
      - feature/v3-p1-trade-commodity-prices
      - feature/v3-p2-verified-event-timeline
      - feature/v3-historical-price-backfill
      - feature/v3-p3-event-price-study
      - feature/v3-p4-sync-quality-monitoring
      - release/v3-integration-acceptance
  pull_request:
    branches:
      - main
      - feature/v3-p0-geoeconomic-foundation
      - feature/v3-p1-trade-commodity-prices
      - feature/v3-p2-verified-event-timeline
      - feature/v3-historical-price-backfill
      - feature/v3-p3-event-price-study
      - feature/v3-p4-sync-quality-monitoring

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m py_compile server.py source_collectors.py geoeconomics.py market_sources.py market_data.py sync_market.py event_data.py sync_events.py historical_prices.py event_price_study.py event_market_model.py sync_health.py sync_tasks.py
      - name: Test Python
        env:
          CONFLICTSCOPE_STRUCTURED_SOURCES: '0'
        run: python -m unittest discover -s tests -v
      - name: V3 cross-phase offline integration acceptance
        env:
          CONFLICTSCOPE_STRUCTURED_SOURCES: '0'
        run: python -m unittest discover -s tests -p test_v3_integration.py -v
      - name: Verify V3 schema CLI
        run: |
          python geoeconomics.py init --db /tmp/conflictscope-ci.sqlite3
          python geoeconomics.py status --db /tmp/conflictscope-ci.sqlite3
      - name: Verify P1 curated source catalog
        run: python sync_market.py catalog
      - name: Frontend syntax and logic regression
        run: |
          node --check static/app.js
          node --check static/timeline.js
          node tests/test_frontend.cjs
          node tests/test_timeline_frontend.cjs
          node tests/test_price_panel_frontend.cjs
          node --check static/study.js
          node tests/test_study_frontend.cjs
          node --check static/sync_status.js
          node tests/test_sync_status_frontend.cjs
      - name: P2 official-source historical dataset (no network)
        run: |
          python sync_events.py validate --file data/official-events-2022-2024.json
          python sync_events.py import --file data/official-events-2022-2024.json --db /tmp/conflictscope-ci.sqlite3
          python sync_events.py import --file data/official-events-2022-2024.json --db /tmp/conflictscope-ci.sqlite3
          python -c "import sys,json; import event_data; d=event_data.timeline(country='UKR',path='/tmp/conflictscope-ci.sqlite3'); assert d['count'] >= 4; assert all(e['research_ai_assisted'] and not e['editor_reviewed'] for e in d['events']); print('Historical events found:', d['count'])"
      - name: Historical price CLI and provenance smoke
        run: |
          python historical_prices.py catalog
          python historical_prices.py --db /tmp/conflictscope-ci.sqlite3 coverage --country UKR
      - name: P4 sync plan and health status smoke (no network)
        run: |
          python sync_tasks.py validate
          python sync_tasks.py --db /tmp/conflictscope-ci.sqlite3 status
      - name: P2 manual ledger CLI smoke
        run: |
          python sync_events.py --help
          python sync_events.py list --db /tmp/conflictscope-ci.sqlite3 --country UKR

