name: V3 Comtrade authenticated source gate
on:
  push:
    branches: [fix/v3-comtrade-authorized-data]
  pull_request:
    branches: [release/v3-integration-acceptance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-comtrade-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public 2024 HS2017 source availability (not trade figures)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import market_sources as m
          for classification in ("H5","H6","HS"):
              url=("https://comtradeapi.un.org/public/v1/getDA/C/A/"
                   +classification+"?reporterCode=804&period=2024")
              try:
                  body=m.fetch_json(url)
                  rows=body.get("data")
                  if not isinstance(rows,list):
                      raise ValueError("Unknown availability response")
                  print("Public availability "+classification+"/UKR/2024: "+str(len(rows))+" records")
                  print("Availability metadata is not a verified HS6 trade amount.")
              except Exception as exc:
                  print("Public availability "+classification+" inconclusive: "+type(exc).__name__)
          PY
      - name: Fail closed without an authorized Data API key
        shell: bash
        run: |
          if [ -z "$COMTRADE_API_KEY" ]; then
            echo "Comtrade release gate BLOCKED: repository secret COMTRADE_API_KEY is not configured."
            exit 1
          fi
      - name: Verify final-data API and exact Ukraine HS6 wheat aggregate
        shell: bash
        run: |
          python - <<'PY'
          import os,sys
          import market_sources as m
          try:
              result=m.comtrade("UKR",2024,commodity="wheat",flow="export",
                               hs_revision="HS2022",
                               key=os.environ["COMTRADE_API_KEY"])
          except Exception as exc:
              print("Comtrade authorized contract failed: "+type(exc).__name__)
              sys.exit(1)
          assert len(result)==1
          assert result[0]["hs_revision"]=="HS2022"
          assert result[0]["hs_code"]=="100199"
          assert result[0]["reporter"]=="UKR"
          assert result[0]["period_start"]=="2024-01-01"
          # Verify the real authenticated observation can also survive the P1
          # transactional SQLite ingestion and read-only app query, in isolation.
          import tempfile
          from pathlib import Path
          import market_data,geoeconomics
          with tempfile.TemporaryDirectory(prefix="comtrade-contract-") as tmp:
              db=Path(tmp)/"verified.sqlite3"
              market_data.initialize(db)
              assert market_data.save_trade(result,db)==1
              assert market_data.save_trade(result,db)==1
              report=market_data.trade_by_country("UKR",year=2024,flow="export",path=db)
              assert len(report["rows"])==1
              assert report["rows"][0]["hs_revision"]=="HS2022"
              assert report["rows"][0]["hs_code"]=="100199"
              assert geoeconomics.status(db)["tables"]["trade_flows"]==1
          print("Comtrade H6/HS2022 authorized final API -> temporary SQLite -> app query: validated")
          print("No trade values logged; API access does not grant data redistribution permission.")
          PY
